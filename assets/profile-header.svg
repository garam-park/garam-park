<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">From experiment to team system</title>
  <desc id="desc">Many exploratory paths converge into three repeatable system lines.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2239"/>
      <stop offset="0.33" stop-color="#18344f"/>
      <stop offset="0.61" stop-color="#edf0ed"/>
      <stop offset="1" stop-color="#f6f2e9"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ba2b5" stop-opacity="0.12"/>
      <stop offset="0.45" stop-color="#6f879b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#173b60" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#background)" filter="url(#grain)"/>

  <g fill="none" stroke="url(#lineFade)" stroke-width="1.15">
    <path d="M350 30 C480 28 505 74 625 80 S725 120 830 120"/>
    <path d="M325 51 C455 50 545 44 630 95 S736 135 830 135" stroke-dasharray="2.5 5"/>
    <path d="M390 69 C500 70 525 108 642 108 S740 145 830 145"/>
    <path d="M336 91 C445 88 520 126 625 126 S730 148 830 150" stroke-dasharray="4 4"/>
    <path d="M370 112 C485 110 510 155 624 147 S720 151 830 150"/>
    <path d="M318 134 C435 132 515 172 620 165 S725 160 830 165"/>
    <path d="M360 156 C470 152 520 190 630 182 S730 172 830 175" stroke-dasharray="2 5"/>
    <path d="M330 179 C460 175 540 212 642 199 S732 186 830 185"/>
    <path d="M382 204 C490 200 545 232 650 218 S748 202 830 195"/>
    <path d="M342 231 C472 223 565 251 664 230 S750 214 830 200" stroke-dasharray="5 4"/>
    <path d="M404 258 C510 246 575 266 675 238 S760 216 830 200"/>
  </g>

  <g fill="#7890a4" opacity="0.8">
    <circle cx="350" cy="30" r="2.4"/>
    <circle cx="325" cy="51" r="2.4"/>
    <circle cx="390" cy="69" r="2.4"/>
    <circle cx="336" cy="91" r="2.4"/>
    <circle cx="370" cy="112" r="2.4"/>
    <circle cx="318" cy="134" r="2.4"/>
    <circle cx="360" cy="156" r="2.4"/>
    <circle cx="330" cy="179" r="2.4"/>
    <circle cx="382" cy="204" r="2.4"/>
    <circle cx="342" cy="231" r="2.4"/>
    <circle cx="404" cy="258" r="2.4"/>
  </g>

  <g fill="none" stroke="#173b60" stroke-width="1.45">
    <path d="M830 120 H1200"/>
    <path d="M830 150 H1200"/>
    <path d="M830 200 H1200"/>
  </g>
  <g fill="#173b60">
    <circle cx="830" cy="120" r="4"/>
    <circle cx="830" cy="150" r="4"/>
    <circle cx="830" cy="200" r="4"/>
  </g>
  <circle cx="746" cy="151" r="3.2" fill="#62bfd0"/>

  <g font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif">
    <text x="70" y="52" fill="#a9c2d5" font-size="12" font-weight="600" letter-spacing="3">
      GARAM PARK / SOFTWARE ENGINEERING
    </text>
    <text x="70" y="112" fill="#fbf8f0" font-size="37" font-weight="750" letter-spacing="1.2">
      FROM EXPERIMENT
    </text>
    <text x="70" y="158" fill="#fbf8f0" font-size="37" font-weight="750" letter-spacing="1.2">
      TO TEAM SYSTEM
    </text>
    <text x="70" y="204" fill="#c9dce9" font-size="15" font-weight="450" letter-spacing="0.2">
      AI-assisted developer workflows for software teams
    </text>
  </g>
</svg>
